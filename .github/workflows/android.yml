name: android-apk

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          cmdline-tools-version: 11076708

      - name: Gradle wrapper
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-ai-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
